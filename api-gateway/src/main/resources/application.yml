spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: tour-service
              uri: http://localhost:8080
              predicates:
                - Path=/api/v1/visit/**

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway